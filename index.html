<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Text Orbit</title>
<meta name="description" content="A word running around a 3D ring, passing behind the object at its centre." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./orbit.css" />
</head>
<body>
  <div class="frame">
    <div class="bar bar--top"></div>

    <div class="stage" id="stage" tabindex="0">
      <div class="orbit" id="orbit" data-text="YOUR SOFTWARE GROWS WITH YOU" data-repeat="1">
        <!-- Centre object slot. Replace the contents of this element with
             your own object — keep the [data-object] attribute and the
             .orbit__object class, which pin it to z = 0 so the ring passes
             behind it. -->
        <div class="orbit__object" data-object>
          <div class="placeholder">object</div>
        </div>
      </div>
    </div>

    <div class="bar bar--bottom"></div>

    <p class="hint">drag to spin</p>

    <div class="controls">
      <label class="field">
        <span class="field__label">text</span>
        <input id="word" type="text" value="YOUR SOFTWARE GROWS WITH YOU" maxlength="44"
               spellcheck="false" autocomplete="off" aria-label="Orbiting text" />
      </label>
    </div>
  </div>

  <script src="./orbit.js"></script>
  <script>
    const orbit = new TextOrbit('#orbit');
    const input = document.getElementById('word');
    input.addEventListener('input', () => {
      orbit.setText((input.value || ' ').toUpperCase());
    });
  </script>
</body>
</html>
