<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Doodle — Pixel Art Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="doodle">
      <div class="doodle-top">
        <div class="doodle-sliders">
          <span class="slider"></span>
          <span class="slider"></span>
        </div>
        <div class="doodle-brand">MAGNA · PIXEL</div>
      </div>
      <div class="doodle-screen">
        <canvas id="board" width="512" height="512"></canvas>
      </div>
      <div class="doodle-bottom">
        <button id="shakeBtn" class="shake-knob" title="Shake to erase everything">
          <span class="knob-face">⟳</span>
          <span class="knob-label">Shake&nbsp;to&nbsp;erase</span>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
